rules:
  - id: local-sql-string-concat
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      SQL built by string concatenation / template literal is passed to a pg client.
      Use parameterized placeholders ($1, $2) instead.
    patterns:
      - pattern-either:
          - pattern: $CLIENT.query(`...${$X}...`, ...)
          - pattern: $CLIENT.query("..." + $X, ...)
          - pattern: $CLIENT.query(`...${$X}...`)
          - pattern: $CLIENT.query("..." + $X)

  - id: local-insecure-randomness-for-secret
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Math.random() is not cryptographically secure; do not use it to produce tokens,
      OTPs, session ids or pseudonyms. Use node:crypto randomInt/randomBytes.
    pattern: Math.random()

  - id: local-non-constant-time-secret-compare
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      Direct equality comparison on a token/hash/secret value leaks timing information.
      Use crypto.timingSafeEqual.
    patterns:
      - pattern-either:
          - pattern: $A.token === $B
          - pattern: $A.tokenHash === $B
          - pattern: $A.token_hash === $B
          - pattern: $A.secret === $B
          - pattern: $A.password === $B
          - pattern: $A.signature === $B

  - id: local-dangerous-dynamic-eval
    languages: [typescript, javascript]
    severity: ERROR
    message: Dynamic code execution sink (eval / new Function) reachable from request data.
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)

  - id: local-child-process-interpolation
    languages: [typescript, javascript]
    severity: ERROR
    message: Shell command built from an interpolated string — command injection risk.
    pattern-either:
      - pattern: $CP.exec(`...${$X}...`, ...)
      - pattern: $CP.execSync(`...${$X}...`, ...)
      - pattern: $CP.exec("..." + $X, ...)

  - id: local-hardcoded-crypto-key-literal
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      A string literal is being used as an HMAC/cipher key. Keys must come from
      configuration/secrets management, never from source.
    pattern-either:
      - pattern: crypto.createHmac($ALG, "...")
      - pattern: crypto.createCipheriv($ALG, "...", ...)
      - pattern: crypto.createDecipheriv($ALG, "...", ...)

  - id: local-weak-hash-for-credential
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      MD5/SHA1 must not be used for credential or token hashing.
    pattern-either:
      - pattern: crypto.createHash("md5")
      - pattern: crypto.createHash("sha1")

  - id: local-tls-verification-disabled
    languages: [typescript, javascript]
    severity: ERROR
    message: TLS certificate verification disabled.
    pattern-either:
      - pattern: "rejectUnauthorized: false"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"

  - id: local-express-permissive-cors
    languages: [typescript, javascript]
    severity: WARNING
    message: Wildcard CORS origin on a credentialed API.
    pattern-either:
      - pattern: 'cors({ origin: "*", ... })'
      - pattern: $RES.setHeader("Access-Control-Allow-Origin", "*")

  - id: local-secret-in-log-or-response
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      A token/OTP/secret value appears to be written to a log sink or a response body.
    pattern-either:
      - pattern: console.log(`...${$TOKEN}...`)
      - pattern: "$LOG.info({ ..., token: $T, ... }, ...)"
      - pattern: "$LOG.info({ ..., otp: $T, ... }, ...)"
      - pattern: "$RES.json({ ..., token: $T, ... })"
      - pattern: "$RES.json({ ..., email: $T, ... })"
      - pattern: "$RES.json({ ..., emailHash: $T, ... })"
      - pattern: "$RES.json({ ..., email_hash: $T, ... })"
