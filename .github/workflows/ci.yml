name: ci

# Plan T3 — lint, typecheck, SQL EXPLAIN check, unit + integration/NFR runners, migration
# apply/rollback check on every push, plus Layer-1 quality-kit gates (cadence.md §1):
# gitleaks (secrets, BLOCKING from first run), semgrep (SAST), osv-scanner (SCA). Layer 2
# (per-milestone agent runs) and Layer 3 (event-triggered checks) are not in this file —
# see architecture.md §8 and quality-kit-additions/cadence.md.
#
# The build-test job deliberately mirrors `npm run verify` (typecheck, lint, sql:check,
# test) with the migration steps added, and keeps the steps separate so a failure names
# itself. Keep the two in step: when local and CI check different things, the gap is where
# defects live.

on:
  push:
  pull_request:

# One run per ref. Without this, pushing a few commits in a row queues that many full
# runs, each claiming the same Postgres service, and the older ones tell you nothing
# you still care about.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: murmur
          POSTGRES_PASSWORD: murmur
          POSTGRES_DB: murmur_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U murmur"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://murmur:murmur@localhost:5432/murmur_test
      EMAIL_HASH_PEPPER_ACTIVE: v1:ci-only-pepper-not-a-real-secret
      # T12 — separate signing domain from the pepper above (oq-14 decision §5).
      SESSION_SIGNING_KEY: v1:ci-only-session-key-not-a-real-secret
      CAMPUS_EMAIL_DOMAINS: nitj.ac.in
      EMAIL_PROVIDER: memory
    steps:
      # SEC-022 (T62) — every `uses:` is pinned to a full commit SHA, not a tag. A tag is a
      # mutable pointer the action's owner can move at any time, so `@v4` means "whatever
      # that account publishes next", and these actions run with a GITHUB_TOKEN in a job
      # that also holds the CI secrets. A SHA cannot be moved. The version in the trailing
      # comment is what the SHA was when it was pinned; dependabot bumps both together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # The PWA client has its own lockfile and its own DOM-aware tsconfig, so its
      # dependencies are not installed by the root `npm ci`.
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      # The client was outside every gate until T19: root tsconfig excludes it, eslint
      # ignored it, and this workflow never ran its typecheck. S1–S4 therefore shipped
      # unverified. Separate step from the server typecheck because the two use different
      # libs (DOM vs Node) and a failure should name which side broke.
      - name: Typecheck (client)
        run: npm run typecheck:client
      - name: Migrate up (apply check)
        run: npm run migrate
      - name: Migrate down + up (rollback check)
        run: npm run migrate:down && npm run migrate
      # EXPLAIN-only validation of every raw SQL statement (plan only, never ANALYZE,
      # inside a rolled-back transaction). Catches wrong columns, bad jsonb operators and
      # parameters Postgres cannot type-infer — none of which tsc can see, because to the
      # compiler a query is an opaque string. This step is in CI because it found two
      # parse-time defects on the moderation publish path on 2026-08-01, each of which had
      # failed 100% of the time since T14a landed while lint, typecheck and 39 unit tests
      # all stayed green. Runs after migrations so the schema it plans against exists.
      - name: SQL EXPLAIN check
        run: npm run sql:check
      - name: Unit + integration + NFR tests
        run: npm test

  # --- Layer-1 quality gates (cadence.md §1) ---
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      # gitleaks is BLOCKING from the first run (no warn-only period) per cadence.md §1.
      # Pinned per SEC-022 — and this is the job where a moved tag would matter most: it
      # reads the full history with a GITHUB_TOKEN, which is exactly what an attacker who
      # could move the tag would want.
      #
      # OQ-SEC-04 (T62, non-blocking, still open): whether this action scans FULL history
      # or only the pushed commit range is unconfirmed. `fetch-depth: 0` gives it the whole
      # history to read, but that is the input, not proof of what it does with it. T62's
      # local run could not settle it because gitleaks is not installed on that machine.
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    runs-on: ubuntu-latest
    container: returntocorp/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: semgrep ci --config auto
        continue-on-error: true # SAST advisory in Layer 1; blocking gate is the M1 security-agent run (T60)

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - run: npm i -g @google/osv-scanner || npx --yes osv-scanner --version || true
      # Both lockfiles, not just the root one. T60 scanned only the root and T62 recorded
      # that the client tree had never been through SCA at all — the client is where `vite`
      # lives, which is the tree carrying the high-severity advisories. One `--lockfile` flag
      # per tree, because the client has its own dependency graph and its own lockfile.
      - name: OSV scan (per lockfile)
        run: |
          npx --yes osv-scanner scan \
            --lockfile=package-lock.json \
            --lockfile=client/package-lock.json
        continue-on-error: true # SCA advisory in Layer 1; escalates via the security-agent milestone gate
