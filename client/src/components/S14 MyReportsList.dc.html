<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#F6EDE4; }
  a { color:#F26B4E; text-decoration:none; } a:hover { color:#D95538; }
  @keyframes cardIn { 0%{ transform:translateY(16px); opacity:0;} 100%{ transform:translateY(0); opacity:1;} }
  @keyframes popIn { 0%{ transform:scale(.6); opacity:0;} 70%{ transform:scale(1.08);} 100%{ transform:scale(1); opacity:1;} }
</style>
</helmet>
<div style="min-height:100vh; display:flex; justify-content:center; font-family:'Plus Jakarta Sans',sans-serif; background:#EFE3D8">
  <div style="width:420px; max-width:100%; min-height:100vh; background:linear-gradient(180deg,#FFF8F1 0%,#FDEFE3 100%); display:flex; flex-direction:column">

    <header style="padding:18px 20px 6px; display:flex; align-items:center; gap:12px">
      <button style="border:none; background:transparent; cursor:pointer; width:34px; height:34px; border-radius:12px; display:flex; align-items:center; justify-content:center; transition:background .15s ease" style-hover="background:#F4E5D9">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M14 6l-6 6 6 6" stroke="#8A7168" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </button>
      <div style="display:flex; flex-direction:column">
        <h1 style="margin:0; font-family:'Baloo 2',sans-serif; font-weight:600; font-size:21px; color:#3D2C26">Your reports</h1>
        <span style="font-size:12.5px; color:#8A7168">What you flagged, and what happened next.</span>
      </div>
    </header>

    <div style="padding:16px 20px 40px; display:flex; flex-direction:column; gap:12px; flex:1">
      <sc-if value="{{ showEmpty }}" hint-placeholder-val="{{ false }}">
        <div style="background:#FFFFFF; border-radius:22px; padding:38px 26px; box-shadow:0 8px 26px rgba(93,58,44,.07); display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center; margin-top:10px; animation:popIn .4s cubic-bezier(.34,1.56,.64,1)">
          <div style="width:60px; height:60px; border-radius:50%; background:#E7F1EA; display:flex; align-items:center; justify-content:center; font-size:26px">🍃</div>
          <h2 style="margin:0; font-family:'Baloo 2',sans-serif; font-weight:600; font-size:19px; color:#3D2C26">Nothing reported</h2>
          <p style="margin:0; font-size:14px; line-height:1.6; color:#8A7168">Hopefully it stays that way. If you ever need it, reporting takes under a minute.</p>
        </div>
      </sc-if>

      <sc-if value="{{ showList }}" hint-placeholder-val="{{ true }}">
        <sc-for list="{{ reports }}" as="r" hint-placeholder-count="3">
          <div style="background:#FFFFFF; border-radius:20px; padding:18px; box-shadow:0 6px 20px rgba(93,58,44,.06); display:flex; flex-direction:column; gap:12px; cursor:pointer; animation:cardIn .4s cubic-bezier(.34,1.2,.64,1) both; animation-delay:{{ r.delay }}; transition:transform .18s cubic-bezier(.34,1.56,.64,1)" style-hover="transform:translateY(-2px)">
            <div style="display:flex; gap:8px; align-items:center">
              <span style="font-family:'Baloo 2',sans-serif; font-weight:600; font-size:15px; color:#3D2C26; flex:1">{{ r.reason }}</span>
              <span style="background:{{ r.chipBg }}; color:{{ r.chipColor }}; font-size:11.5px; font-weight:700; padding:4px 12px; border-radius:999px; white-space:nowrap">{{ r.statusLabel }}</span>
            </div>

            <div style="display:flex; flex-direction:column; gap:0">
              <sc-for list="{{ r.steps }}" as="st" hint-placeholder-count="3">
                <div style="display:flex; gap:10px; align-items:stretch">
                  <div style="display:flex; flex-direction:column; align-items:center; width:14px">
                    <span style="width:9px; height:9px; border-radius:50%; background:{{ st.dot }}; margin-top:4px; flex:none"></span>
                    <sc-if value="{{ st.hasLine }}" hint-placeholder-val="{{ true }}">
                      <span style="width:2px; flex:1; background:{{ st.line }}; margin:2px 0"></span>
                    </sc-if>
                  </div>
                  <div style="display:flex; flex-direction:column; gap:1px; padding-bottom:12px">
                    <span style="font-size:13px; font-weight:700; color:{{ st.titleColor }}">{{ st.title }}</span>
                    <span style="font-size:12px; line-height:1.5; color:#8A7168">{{ st.detail }}</span>
                  </div>
                </div>
              </sc-for>
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid #F4E5D9; padding-top:10px">
              <span style="font-size:11.5px; font-weight:600; color:#C4AB9E">{{ r.id }}</span>
              <span style="font-size:12px; font-weight:700; color:{{ r.slaColor }}">{{ r.slaText }}</span>
            </div>
          </div>
        </sc-for>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 420, &quot;height&quot;: 900}, &quot;state&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;live&quot;, &quot;options&quot;: [&quot;live&quot;, &quot;empty&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;State&quot;}}">
class Component extends DCLogic {
  reports() {
    const sage = "#6FA287", sand = "#E0CDBF", ink = "#3D2C26";
    return [
      { id: "GRV-2093", reason: "Reveals someone's real identity", status: "open",
        statusLabel: "Being reviewed", chipBg: "#EFF4F3", chipColor: "#5F7F7C",
        slaText: "Response due by tomorrow, 11:02 AM", slaColor: "#4E7A62",
        steps: [
          { title: "Received", detail: "today, 11:02 AM", dot: sage, line: sage, titleColor: ink, hasLine: true },
          { title: "Under review", detail: "a person is on it now", dot: sage, line: sand, titleColor: ink, hasLine: true },
          { title: "Resolution", detail: "you'll hear from us either way", dot: sand, line: sand, titleColor: "#B99C8D", hasLine: false }
        ] },
      { id: "GRV-2071", reason: "Harassment or bullying", status: "resolved",
        statusLabel: "Resolved — taken down", chipBg: "#E7F1EA", chipColor: "#4E7A62",
        slaText: "Resolved within the promised window", slaColor: "#4E7A62",
        steps: [
          { title: "Received", detail: "Jul 12, 09:14 AM", dot: sage, line: sage, titleColor: ink, hasLine: true },
          { title: "Reviewed", detail: "same day", dot: sage, line: sage, titleColor: ink, hasLine: true },
          { title: "Content taken down", detail: "Jul 12, 4:40 PM — thank you for speaking up", dot: sage, line: sand, titleColor: ink, hasLine: false }
        ] },
      { id: "GRV-2064", reason: "Spam or advertising", status: "resolved",
        statusLabel: "Resolved — kept up", chipBg: "#F4EDE3", chipColor: "#9A8168",
        slaText: "Resolved Jul 9, 10:05 AM", slaColor: "#8A7168",
        steps: [
          { title: "Received", detail: "Jul 8, 6:20 PM", dot: sage, line: sage, titleColor: ink, hasLine: true },
          { title: "Reviewed", detail: "checked against the rules", dot: sage, line: sage, titleColor: ink, hasLine: true },
          { title: "Kept up", detail: "it didn't break a rule this time — reporting it was still right", dot: sage, line: sand, titleColor: ink, hasLine: false }
        ] }
    ].map((r, i) => ({ ...r, delay: (i * 0.08) + "s" }));
  }
  renderVals() {
    const state = this.props.state ?? "live";
    return {
      reports: this.reports(),
      showList: state === "live",
      showEmpty: state === "empty"
    };
  }
}
</script>
</body>
</html>
